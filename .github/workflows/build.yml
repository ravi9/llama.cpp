name: CI

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - I-N-T-E-L_CI_windows_openvino_patch
    paths: [
              '.github/workflows/build.yml',
              '.github/workflows/build-linux-cross.yml',
              '.github/workflows/build-cmake-pkg.yml',
              '**/CMakeLists.txt',
              '**/.cmake',
              '**/*.h',
              '**/*.hpp',
              '**/*.c',
              '**/*.cpp',
              '**/*.cu',
              '**/*.cuh',
              '**/*.swift',
              '**/*.m',
              '**/*.metal',
              '**/*.comp'
            ]

  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
              '.github/workflows/build.yml',
              '.github/workflows/build-linux-cross.yml',
              '.github/workflows/build-cmake-pkg.yml',
              '**/CMakeLists.txt',
              '**/.cmake',
              '**/*.h',
              '**/*.hpp',
              '**/*.c',
              '**/*.cpp',
              '**/*.cu',
              '**/*.cuh',
              '**/*.swift',
              '**/*.m',
              '**/*.metal',
              '**/*.comp'
            ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_LOG_COLORS: 1
  LLAMA_LOG_PREFIX: 1
  LLAMA_LOG_TIMESTAMPS: 1

jobs:
  windows-latest-cmake-openvino:
    runs-on: windows-2022
  
    env:
      OPENVINO_VERSION_MAJOR: "2025.3"
      OPENVINO_VERSION_FULL: "2025.3.0.19807.44526285f24"
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Install Visual Studio Build Tools
        run: |
          choco install visualstudio2022buildtools --yes --params "--add Microsoft.VisualStudio.Workload.VCTools --quiet"
  
      - name: Download and extract OpenVINO Toolkit
        shell: powershell
        run: |
          $url = "https://storage.openvinotoolkit.org/repositories/openvino/packages/2025.3/windows/openvino_toolkit_windows_2025.3.0.19807.44526285f24_x86_64.zip"
          $out = "openvino.zip"
          Invoke-WebRequest -Uri $url -OutFile $out
          Expand-Archive -Path $out -DestinationPath openvino_toolkit -Force
          Remove-Item $out
  
      - name: Initialize MSVC, OpenVINO, and Build
        shell: cmd
        run: |
          REM Initialize MSVC environment
          call "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
      
          REM Call OpenVINO setupvars.bat
          call openvino_toolkit_windows_2025.3.0.19807.44526285f24_x86_64\openvino_toolkit_windows_2025.3.0.19807.44526285f24_x86_64\setupvars.bat
      
          REM Set OpenVINO_DIR to the cmake folder
          set "OpenVINO_DIR=%CD%\openvino_toolkit_windows_2025.3.0.19807.44526285f24_x86_64\openvino_toolkit_windows_2025.3.0.19807.44526285f24_x86_64\runtime\cmake"
      
          REM Build with CMake using Visual Studio generator
          cmake -B build\ReleaseOV -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_OPENVINO=ON ^
            -DOpenVINO_DIR="%OpenVINO_DIR%"
      
          cmake --build build\ReleaseOV --config Release
      
