name: CI

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - I-N-T-E-L_CI_windows_openvino_patch
    paths: [
              '.github/workflows/build.yml',
              '.github/workflows/build-linux-cross.yml',
              '.github/workflows/build-cmake-pkg.yml',
              '**/CMakeLists.txt',
              '**/.cmake',
              '**/*.h',
              '**/*.hpp',
              '**/*.c',
              '**/*.cpp',
              '**/*.cu',
              '**/*.cuh',
              '**/*.swift',
              '**/*.m',
              '**/*.metal',
              '**/*.comp'
            ]

  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
              '.github/workflows/build.yml',
              '.github/workflows/build-linux-cross.yml',
              '.github/workflows/build-cmake-pkg.yml',
              '**/CMakeLists.txt',
              '**/.cmake',
              '**/*.h',
              '**/*.hpp',
              '**/*.c',
              '**/*.cpp',
              '**/*.cu',
              '**/*.cuh',
              '**/*.swift',
              '**/*.m',
              '**/*.metal',
              '**/*.comp'
            ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_LOG_COLORS: 1
  LLAMA_LOG_PREFIX: 1
  LLAMA_LOG_TIMESTAMPS: 1

jobs:
  windows-latest-cmake-openvino:
    runs-on: windows-2022

    env:
      OPENVINO_VERSION_MAJOR: "2025.3"
      OPENVINO_VERSION_FULL: "2025.3.0.19807.44526285f24"

    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Visual Studio Build Tools
      - name: Setup MSBuild / VS Build Tools
        uses: microsoft/setup-msbuild@v1

      # Install Chocolatey packages needed for building
      - name: Install dependencies
        run: |
          choco install cmake --yes

      # Download and extract OpenVINO
      - name: Download and extract OpenVINO Runtime
        shell: powershell
        run: |
          $url = "https://storage.openvinotoolkit.org/repositories/openvino/packages/2025.3/windows/openvino_toolkit_windows_2025.3.0.19807.44526285f24_x86_64.zip"
          $out = "openvino.zip"
          Invoke-WebRequest -Uri $url -OutFile $out
          Expand-Archive -Path $out -DestinationPath openvino_toolkit -Force
          Remove-Item $out

      - name: Build with OpenVINO
        shell: cmd
        run: |
          REM Find extracted OpenVINO folder dynamically
          for /d %%i in (openvino_toolkit\*) do set OPENVINO_ROOT=%%i
          set "OpenVINO_DIR=%OPENVINO_ROOT%\runtime\cmake"
      
          if not exist "%OpenVINO_DIR%\OpenVINOConfig.cmake" (
              echo ERROR: OpenVINOConfig.cmake not found
              exit /b 1
          )
      
          cmake -B build\ReleaseOV -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_OPENVINO=ON ^
            -DOpenVINO_DIR="%OpenVINO_DIR%"
      
          cmake --build build\ReleaseOV --config Release

      
